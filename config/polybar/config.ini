[bar/example]
width = 100%
height = 14pt
radius = 0

; dpi = 96

background = #131419
foreground = ${colors.foreground}

line-size = 2pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1
;module-margin = 0

separator = |
separator-foreground = ${colors.disabled}
;separator-foreground = #00131419

font-0 = Liberation Mono:pixelsize=9;2
font-1 = LiterationMono Nerd Font Mono:pixelsize=10;2

modules-left = xworkspaces xwindow
modules-right = uptime bright temp xkeyboard filesystem cpu ram pulseaudio wlan battery date systray 

cursor-click = pointer
cursor-scroll = ns-resize

;enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

; This module is not active by default (to enable it, add it to one of the
; modules-* list above).
; Please note that only a single tray can exist at any time. If you launch
; multiple bars with this module, only a single one will show it, the others
; will produce a warning. Which bar gets the module is timing dependent and can
; be quite random.
; For more information, see the documentation page for this module:
; https://polybar.readthedocs.io/en/stable/user/modules/tray.html

;[module/memory]
;type = internal/memory
;interval = 2
;format-prefix = " "
;format-prefix-foreground = ${colors.foreground}
;label = %percentage_used:2%%

;[module/battery]
;type = internal/battery
;interval = 2
;label-charging = 󱊡 %{F#BBBBBB}%percentage%%
;label-charging-foreground = ${colors.bred}
;label-discharging = 󱊣 %{F#BBBBBB}%percentage%%
;label-discharging-foreground = ${colors.bblue}
;label-full = 󱊣 %{F#BBBBBB}%percentage%%
;label-full-foreground = ${colors.green}


[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %a %b %d %H:%M
label = %date%
label-foreground = ${colors.red}
;format-underline = ${colors.red}

[network-base]
type = internal/network
interval = 5
format-connected = <label-connected>
format-disconnected = <label-disconnected>
label-disconnected = 󰖪 disconnected
label-disconnected-foreground = ${colors.disabled}
;label-disconnected-underline = ${colors.blue}
[module/wlan]
inherit = network-base
interface-type = wireless
label-connected =  %essid%
label-connected-foreground = ${colors.blue}
;label-connected-underline = ${colors.blue}
;[module/eth]
;inherit = network-base
;interface-type = wired
;label-connected = %{F#F0C674}%ifname%%{F-}

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.magenta}
label = %percentage:2%%
label-foreground = ${colors.magenta}
;format-underline = ${colors.magenta}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.green}
;label-layout-underline = ${colors.green}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/xwindow]
type = internal/xwindow
label = " %title:0:60:...% "
label-background = ${colors.background-window}
label-foreground = ${colors.black}

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted =  %percentage_used%%
label-mounted-foreground = ${colors.yellow}
;label-mounted-underline = ${colors.yellow}
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}
;label-unmounted-underline = ${colors.yellow}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = " %percentage%%"
label-volume-foreground = ${colors.cyan}
;label-volume-underline = ${colors.cyan}
label-muted =  muted
label-muted-foreground = ${colors.disabled}
;label-muted-underline = ${colors.cyan}

[module/systray]
type = internal/tray
format-margin = 2px
tray-spacing = 4pt

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = #F2131419
label-active-underline= ${colors.secondary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/ram]
type = custom/script
exec = ~/.config/polybar/scripts/memory_sx
format-foreground = ${colors.bmagenta}
;format-underline = ${colors.bmagenta}

[module/uptime]
type = custom/script
exec = ~/.config/polybar/scripts/uptime_sx
format-foreground = ${colors.bblue}
;format-underline = ${colors.bblue}

[module/temp]
type = custom/script
exec = ~/.config/polybar/scripts/temp_sx
format-foreground = ${colors.bred}
;format-underline = ${colors.bred}

[module/bright]
type = custom/script
exec = ~/.config/polybar/scripts/bright_sx
format-foreground = ${colors.byellow}
;format-underline = ${colors.byellow}

[module/battery]
type = custom/script
exec = ~/.config/polybar/scripts/battery_sx
format-foreground = ${colors.bcyan}
;format-underline = ${colors.bcyan}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
